- id: "NuGet:Newtonsoft:Json"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Newtonsoft:Json"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/JamesNK/Newtonsoft.Json.git"

- id: "NuGet:Newtonsoft:Json"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "Src/Newtonsoft.Json"

- id: "NuGet:Newtonsoft:Json"
  curations:
    comment: |
      Map declared license based on
      https://github.com/JamesNK/Newtonsoft.Json/blob/13.0.3/LICENSE.md,
      https://github.com/JamesNK/Newtonsoft.Json/blob/13.0.4/LICENSE.md?plain=1#L1-L20.
    declared_license_mapping:
      "https://www.nuget.org/packages/Newtonsoft.Json/13.0.3/license": "MIT"
      "https://www.nuget.org/packages/Newtonsoft.Json/13.0.4/license": "MIT"