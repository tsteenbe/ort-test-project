- id: "NuGet:Microsoft.ApplicationInsights:WorkerService"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Microsoft.ApplicationInsights:WorkerService"
  curations:
    comment: |
      Map declared license based on
      https://github.com/microsoft/ApplicationInsights-dotnet/blob/43825e06a22cdfb702fc199a7ba99a7d541d48c6/LICENSE.
      https://github.com/microsoft/ApplicationInsights-dotnet/blob/2.23.0/LICENSE.
    declared_license_mapping:
      "https://www.nuget.org/packages/Microsoft.ApplicationInsights.WorkerService/2.22.0/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.ApplicationInsights.WorkerService/2.23.0/license": "MIT"

- id: "NuGet:Microsoft.ApplicationInsights:WorkerService:[2.12.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
    vcs:
      type: "Git"
      url: "https://github.com/Microsoft/ApplicationInsights-dotnet.git"

- id: "NuGet:Microsoft.ApplicationInsights:WorkerService:[2.12.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "NETCORE/src/Microsoft.ApplicationInsights.WorkerService"

- id: "NuGet:Microsoft.ApplicationInsights:WorkerService:[2.8.0,2.12.0["
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
    vcs:
      type: "Git"
      url: "https://github.com/microsoft/ApplicationInsights-aspnetcore.git"

- id: "NuGet:Microsoft.ApplicationInsights:WorkerService:[2.8.0,2.12.0["
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/Microsoft.ApplicationInsights.WorkerService"