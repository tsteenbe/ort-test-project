- id: "NuGet:Microsoft.Extensions:ObjectPool"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Microsoft.Extensions:ObjectPool"
  curations:
    comment: |
      Map declared license based on
      https://github.com/dotnet/aspnetcore/blob/v9.0.2/LICENSE.txt#L1-L23.
    declared_license_mapping:
      "https://www.nuget.org/packages/Microsoft.Extensions.ObjectPool/9.0.2/license": "MIT"

- id: "NuGet:Microsoft.Extensions:ObjectPool:[10.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
      Found VCS via package registry, see https://www.nuget.org/packages/Microsoft.Extensions.ObjectPool.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:Microsoft.Extensions:ObjectPool:[10.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/aspnetcore/src/ObjectPool"

- id: "NuGet:Microsoft.Extensions:ObjectPool:[5.0.0,10.0.0["
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/aspnetcore.git"

- id: "NuGet:Microsoft.Extensions:ObjectPool:[5.0.0,10.0.0["
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/ObjectPool/src"
