- id: "NuGet:Microsoft.Extensions:Configuration.Abstractions"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Microsoft.Extensions:Configuration.Abstractions:[10.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/microsoft.extensions.configuration.abstractions/.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:Microsoft.Extensions:Configuration.Abstractions:[10.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/runtime/src/libraries/Microsoft.Extensions.Configuration.Abstractions/src"

- id: "NuGet:Microsoft.Extensions:Configuration.Abstractions"
  curations:
    comment: |
      Map declared license based on
      https://github.com/dotnet/runtime/blob/v8.0.0/LICENSE.TXT,
      https://github.com/dotnet/runtime/blob/v9.0.0/LICENSE.TXT,
      https://github.com/dotnet/runtime/blob/v9.0.12/LICENSE.TXT,
      https://github.com/dotnet/dotnet/blob/v10.0.2/src/runtime/LICENSE.TXT,
      https://github.com/dotnet/dotnet/blob/v10.0.3/src/runtime/LICENSE.TXT#L1-L23,
      https://github.com/dotnet/dotnet/blob/v10.0.7/src/runtime/LICENSE.TXT#L1-L23 and
      https://github.com/dotnet/dotnet/blob/v10.0.9/src/runtime/LICENSE.TXT#L1-L23.
    declared_license_mapping:
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/8.0.0/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/9.0.0/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/9.0.12/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/10.0.2/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/10.0.3/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/10.0.7/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/10.0.9/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Extensions.Configuration.Abstractions/10.0.10/license": "MIT"

