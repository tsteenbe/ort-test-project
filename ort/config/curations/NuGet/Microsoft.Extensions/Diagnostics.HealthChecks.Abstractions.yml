- id: "NuGet:Microsoft.Extensions:Diagnostics.HealthChecks.Abstractions"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Microsoft.Extensions:Diagnostics.HealthChecks.Abstractions"
  curations:
    comment: |
      Map declared license based on
      https://github.com/dotnet/aspnetcore/blob/v8.0.19/src/HealthChecks/Abstractions/src/LICENSE.txt.
    declared_license_mapping:
      "https://www.nuget.org/packages/Microsoft.Extensions.Diagnostics.HealthChecks.Abstractions/8.0.19/license": "MIT"

- id: "NuGet:Microsoft.Extensions:Diagnostics.HealthChecks.Abstractions:[10.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:Microsoft.Extensions:Diagnostics.HealthChecks.Abstractions:[10.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/aspnetcore/src/HealthChecks/Abstractions/src"

