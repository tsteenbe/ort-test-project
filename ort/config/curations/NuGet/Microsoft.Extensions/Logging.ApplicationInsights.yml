- id: "NuGet:Microsoft.Extensions:Logging.ApplicationInsights"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Microsoft.Extensions:Logging.ApplicationInsights"
  curations:
    comment: |
      Map declared license based on
      https://github.com/microsoft/ApplicationInsights-dotnet/blob/2.23.0/LICENSE
    declared_license_mapping:
      "https://www.nuget.org/packages/Microsoft.Extensions.Logging.ApplicationInsights/2.23.0/license": "MIT"

- id: "NuGet:Microsoft.Extensions:Logging.ApplicationInsights:[2.12.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/Azure.Identity
    vcs:
      type: "Git"
      url: "https://github.com/Microsoft/ApplicationInsights-dotnet.git"

- id: "NuGet:Microsoft.Extensions:Logging.ApplicationInsights:[2.12.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "LOGGING/src/ILogger"

- id: "NuGet:Microsoft.Extensions:Logging.ApplicationInsights:[2.9.1,2.11.0]"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/Azure.Identity
    vcs:
      type: "Git"
      url: "https://github.com/Microsoft/ApplicationInsights-dotnet-logging.git"

- id: "NuGet:Microsoft.Extensions:Logging.ApplicationInsights:[2.9.1,2.11.0]"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/ILogger"