- id: "NuGet:System.Text:Encodings.Web"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:System.Text:Encodings.Web"
  curations:
    comment: |
      Map declared license based on
      https://github.com/dotnet/dotnet/blob/v10.0.1/src/runtime/LICENSE.TXT.
    declared_license_mapping:
      "https://www.nuget.org/packages/System.Text.Encodings.Web/6.0.0/license": "MIT"
      "https://www.nuget.org/packages/System.Text.Encodings.Web/7.0.0/license": "MIT"
      "https://www.nuget.org/packages/System.Text.Encodings.Web/8.0.0/license": "MIT"
      "https://www.nuget.org/packages/System.Text.Encodings.Web/10.0.1/license": "MIT"

- id: "NuGet:System.Text:Encodings.Web:[10.0.1,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:System.Text:Encodings.Web:[10.0.1,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/runtime/src/libraries/System.Text.Encodings.Web/src"

- id: "NuGet:System.Text:Encodings.Web:[5.0.0,10.0.1["
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/runtime.git"

- id: "NuGet:System.Text:Encodings.Web:[5.0.0,10.0.1["
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/libraries/System.Text.Encodings.Web/src"