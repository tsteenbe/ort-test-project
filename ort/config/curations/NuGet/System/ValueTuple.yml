- id: "NuGet:System:ValueTuple"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:System:ValueTuple"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/corefx.git"

- id: "NuGet:System:ValueTuple"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/System.ValueTuple/src"

- id: "NuGet:System:ValueTuple:4.5.0"
  curations:
    comment: |
      Package code repository missing version tag for this release.
      There is a 'version.txt' file inside the .nupkg archive that identifies the commit used for this version, see
      https://www.nuget.org/packages/System.ValueTuple/4.5.0 and
      https://github.com/dotnet/corefx/commit/30ab651fcb4354552bd4891619a0bdd81e0ebdbf.
    vcs:
      revision: "30ab651fcb4354552bd4891619a0bdd81e0ebdbf"
