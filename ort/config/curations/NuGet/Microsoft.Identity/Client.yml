- id: "NuGet:Microsoft.Identity:Client"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Microsoft.Identity:Client"
  curations:
    comment: |
      Map declared license based on
      https://github.com/AzureAD/microsoft-authentication-library-for-dotnet/blob/4.86.0/LICENSE#L1-L21.
    declared_license_mapping:
      "https://www.nuget.org/packages/Microsoft.Identity.Client/4.79.2/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Identity.Client/4.83.1/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Identity.Client/4.84.2/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Identity.Client/4.85.2/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Identity.Client/4.86.0/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.Identity.Client/4.86.1/license": "MIT"

- id: "NuGet:Microsoft.Identity:Client:[4.4.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/client/Microsoft.Identity.Client"

- id: "NuGet:Microsoft.Identity:Client:[2.6.1,4.4.0["
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/Microsoft.Identity.Client"

- id: "NuGet:Microsoft.Identity:Client:[2.6.1,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/Microsoft.Identity.Client.
    vcs:
      type: "Git"
      url: "https://github.com/AzureAD/microsoft-authentication-library-for-dotnet.git"
