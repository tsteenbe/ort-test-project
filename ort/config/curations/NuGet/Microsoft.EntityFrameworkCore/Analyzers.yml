- id: "NuGet:Microsoft.EntityFrameworkCore:Analyzers"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Microsoft.EntityFrameworkCore:Analyzers:[10.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/microsoft.entityframeworkcore.analyzers/.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:Microsoft.EntityFrameworkCore:Analyzers:[10.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within repository.
    vcs:
      path: "src/efcore/src/EFCore.Analyzers"

- id: "NuGet:Microsoft.EntityFrameworkCore:Analyzers:[2.1.0,10.0.0["
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/microsoft.entityframeworkcore.analyzers/.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/efcore.git"

- id: "NuGet:Microsoft.EntityFrameworkCore:Analyzers:[2.1.0,10.0.0["
  curations:
    comment: |
      Package resides in its own directory within repository.
    vcs:
      path: "src/EFCore.Analyzers"

- id: "NuGet:Microsoft.EntityFrameworkCore:Analyzers"
  curations:
    comment: |
      Mapping declared license based on
      https://github.com/dotnet/efcore/blob/v7.0.20/LICENSE.txt#L1-L23,
      https://github.com/dotnet/efcore/blob/v8.0.23/LICENSE.txt.
    declared_license_mapping:
      "https://www.nuget.org/packages/Microsoft.EntityFrameworkCore.Analyzers/7.0.20/license": "MIT"
      "https://www.nuget.org/packages/Microsoft.EntityFrameworkCore.Analyzers/8.0.23/license": "MIT"