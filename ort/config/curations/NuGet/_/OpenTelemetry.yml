- id: "NuGet::OpenTelemetry"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet::OpenTelemetry"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/OpenTelemetry.
    vcs:
      type: "Git"
      url: "https://github.com/open-telemetry/opentelemetry-dotnet.git"

- id: "NuGet::OpenTelemetry"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/OpenTelemetry"

- id: "NuGet::OpenTelemetry"
  curations:
    comment: |
      Mapp declared license based on
      https://github.com/open-telemetry/opentelemetry-dotnet/blob/a67acd87d5e4d437c5398664f75faa19494beb9c/LICENSE.TXT,
      https://github.com/open-telemetry/opentelemetry-dotnet/blob/core-1.16.0/LICENSE.TXT#L1-L201.
    declared_license_mapping:
      "https://www.nuget.org/packages/OpenTelemetry/1.12.0/license": "Apache-2.0"
      "https://www.nuget.org/packages/OpenTelemetry/1.16.0/license": "Apache-2.0"
      "https://www.nuget.org/packages/OpenTelemetry/1.17.0/license": "Apache-2.0"