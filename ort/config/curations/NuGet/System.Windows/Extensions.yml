- id: "NuGet:System.Windows:Extensions"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:System.Windows:Extensions:[5.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/runtime"

- id: "NuGet:System.Windows:Extensions:[5.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/libraries/System.Windows.Extensions"

- id: "NuGet:System.Windows:Extensions:[5.0.0,)"
  curations:
    comment: |
      Mapping declared license based on
      https://github.com/dotnet/runtime/blob/v6.0.0/LICENSE.TXT.
    declared_license_mapping:
      "https://www.nuget.org/packages/System.Windows.Extensions/5.0.0/license": "MIT"
      "https://www.nuget.org/packages/System.Windows.Extensions/6.0.0/license": "MIT"
