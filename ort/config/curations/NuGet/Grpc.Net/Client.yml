- id: "NuGet:Grpc.Net:Client"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Grpc.Net:Client"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://github.com/grpc/grpc-dotnet.
    vcs:
      type: "Git"
      url: "https://github.com/grpc/grpc-dotnet.git"

- id: "NuGet:Grpc.Net:Client"
  curations:
    comment: |
      Package resides in its own directory within repository.
    vcs:
      path: "src/Grpc.Net.Client"

- id: "NuGet:Grpc.Net:Client"
  curations:
    comment: |
      Mapping declared license based on
      https://github.com/grpc/grpc-dotnet/blob/v2.65.0/LICENSE
      https://github.com/grpc/grpc-dotnet/blob/v2.76.0/LICENSE
    declared_license_mapping:
      "https://www.nuget.org/packages/Grpc.Net.Client/2.65.0/license": "Apache-2.0"
      "https://www.nuget.org/packages/Grpc.Net.Client/2.76.0/license": "Apache-2.0"