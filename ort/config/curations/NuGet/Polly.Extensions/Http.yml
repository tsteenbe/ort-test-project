- id: "NuGet:Polly.Extensions:Http"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Polly.Extensions:Http"
  curations:
    comment: |
      Map declared license based on
      https://github.com/App-vNext/Polly.Extensions.Http/blob/69fd292b/src/LICENSE.txt.
    declared_license_mapping:
      "https://www.nuget.org/packages/Polly.Extensions.Http/3.0.0/license": "BSD-3-Clause"

- id: "NuGet:Polly.Extensions:Http"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/Polly.Extensions.Http.
    vcs:
      type: "Git"
      url: "https://github.com/App-vNext/Polly.Extensions.Http.git"

- id: "NuGet:Polly.Extensions:Http"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src"
