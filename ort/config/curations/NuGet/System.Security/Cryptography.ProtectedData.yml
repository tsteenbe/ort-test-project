- id: "NuGet:System.Security:Cryptography.ProtectedData"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:System.Security:Cryptography.ProtectedData"
  curations:
    comment: |
      Map declared license based on
      https://github.com/dotnet/runtime/blob/v6.0.0/LICENSE.TXT#L1-L23 and
      https://github.com/dotnet/runtime/blob/v8.0.0/LICENSE.TXT#L1-L23.
    declared_license_mapping:
      "https://www.nuget.org/packages/System.Security.Cryptography.ProtectedData/6.0.0/license": "MIT"
      "https://www.nuget.org/packages/System.Security.Cryptography.ProtectedData/8.0.0/license": "MIT"

- id: "NuGet:System.Security:Cryptography.ProtectedData:[10.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable from internal package registries (e.g., Artifactory).
      Found VCS via package registry, see https://www.nuget.org/packages/System.Security.Cryptography.ProtectedData
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:System.Security:Cryptography.ProtectedData:[10.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/runtime/src/libraries/System.Security.Cryptography.ProtectedData"

