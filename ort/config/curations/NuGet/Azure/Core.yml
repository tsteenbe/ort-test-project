- id: "NuGet:Azure:Core"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Azure:Core"
  curations:
    comment: |
      Package source location is not consistently declared across versions.
      Using VCS mapping for source inspection.
    vcs:
      type: "Git"
      url: "https://github.com/Azure/azure-sdk-for-net.git"

- id: "NuGet:Azure:Core"
  curations:
    comment: "The project resides in its own directory."
    vcs:
      path: "sdk/core/Azure.Core/src"

- id: "NuGet:Azure:Core"
  curations:
    comment: |
      Map declared license based on
      https://github.com/Azure/azure-sdk-for-net/blob/Azure.Core_1.55.0/LICENSE.txt#L1-L21
    declared_license_mapping:
      "https://www.nuget.org/packages/Azure.Core/1.54.0/license": "MIT"
      "https://www.nuget.org/packages/Azure.Core/1.55.0/license": "MIT"
      "https://www.nuget.org/packages/Azure.Core/1.60.0/license": "MIT"
