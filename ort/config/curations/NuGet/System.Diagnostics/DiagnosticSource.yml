- id: "NuGet:System.Diagnostics:DiagnosticSource"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:System.Diagnostics:DiagnosticSource:[5.0.0,10.0.0["
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/runtime.git"

- id: "NuGet:System.Diagnostics:DiagnosticSource:[5.0.0,10.0.0["
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/libraries/System.Diagnostics.DiagnosticSource/src"

- id: "NuGet:System.Diagnostics:DiagnosticSource:[10.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:System.Diagnostics:DiagnosticSource:[10.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/runtime/src/libraries/System.Diagnostics.DiagnosticSource/src"

- id: "NuGet:System.Diagnostics:DiagnosticSource:[6.0.1,)"
  curations:
    comment: |
      Map declared license based on
      https://github.com/dotnet/runtime/blob/v6.0.1/LICENSE.TXT#L1-L23
      https://github.com/dotnet/runtime/blob/v8.0.1/LICENSE.TXT#L1-L23
      https://github.com/dotnet/dotnet/blob/v10.0.2/src/runtime/LICENSE.TXT.
    declared_license_mapping:
      "https://www.nuget.org/packages/System.Diagnostics.DiagnosticSource/6.0.1/license": "MIT"
      "https://www.nuget.org/packages/System.Diagnostics.DiagnosticSource/8.0.1/license": "MIT"
      "https://www.nuget.org/packages/System.Diagnostics.DiagnosticSource/10.0.2/license": "MIT"