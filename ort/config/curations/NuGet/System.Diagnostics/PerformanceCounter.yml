- id: "NuGet:System.Diagnostics:PerformanceCounter"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:System.Diagnostics:PerformanceCounter"
  curations:
    comment: |
      Map declared license based on
      https://github.com/dotnet/runtime/blob/v5.0.0/LICENSE.TXT.
      https://github.com/dotnet/runtime/blob/v6.0.0/LICENSE.TXT.
      https://github.com/dotnet/runtime/blob/v8.0.1/LICENSE.TXT.
    declared_license_mapping:
      "https://www.nuget.org/packages/System.Diagnostics.PerformanceCounter/5.0.0/license": "MIT"
      "https://www.nuget.org/packages/System.Diagnostics.PerformanceCounter/6.0.0/license": "MIT"
      "https://www.nuget.org/packages/System.Diagnostics.PerformanceCounter/8.0.1/license": "MIT"

- id: "NuGet:System.Diagnostics:PerformanceCounter:[10.0.0,)"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/dotnet.git"

- id: "NuGet:System.Diagnostics:PerformanceCounter:[10.0.0,)"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/runtime/src/libraries/System.Diagnostics.PerformanceCounter/src"

- id: "NuGet:System.Diagnostics:PerformanceCounter:[5.0.0,10.0.0["
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/dotnet/runtime.git"

- id: "NuGet:System.Diagnostics:PerformanceCounter:[5.0.0,10.0.0["
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "src/libraries/System.Diagnostics.PerformanceCounter/src"