- id: "NuGet:Newtonsoft.Json:Schema"
  curations:
    comment: |
      Enforce scanning the code repository because the source artifact does not contain all corresponding source files.
    source_code_origins: [VCS]

- id: "NuGet:Newtonsoft.Json:Schema"
  curations:
    comment: |
      Package code repository location is not declared, or the metadata is unavailable in internal Artifactory.
    vcs:
      type: "Git"
      url: "https://github.com/JamesNK/Newtonsoft.Json.Schema.git"

- id: "NuGet:Newtonsoft.Json:Schema"
  curations:
    comment: |
      Package resides in its own directory within code repository.
    vcs:
      path: "Src/Newtonsoft.Json.Schema"

- id: "NuGet:Newtonsoft.Json:Schema"
  curations:
    comment: |
      Map declared license based on
      https://github.com/JamesNK/Newtonsoft.Json.Schema/blob/4.0.1/LICENSE.md?plain=1#L1-L17.
    declared_license_mapping:
      "https://www.nuget.org/packages/Newtonsoft.Json.Schema/4.0.1/license": "LicenseRef-scancode-commercial-license"